name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # eslint exits nonzero only on errors; the react-hooks v6 strict rules
      # are intentionally warnings (see eslint.config.js).
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm run build
      # Public deployments load feature flags from .env.public. Exercise that
      # exact mode so voice/VAD configuration cannot silently drift from CI.
      - run: pnpm run build:public

  # Standalone product smoke gate. The fixture bypasses model generation,
  # while auth is mocked, so this checks routing and the real learning canvas
  # without requiring a live Octos server.
  e2e-smoke:
    name: e2e Octos Learn smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      # The specs default to http://localhost:5174; playwright.config.ts has
      # no webServer entry, so the Vite dev server is started here and kept
      # alive for the whole step.
      - name: Start Vite dev server
        run: |
          pnpm exec vite --port 5174 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5174/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5174/ >/dev/null || (echo "vite failed to start" && exit 1)
      - run: pnpm test:e2e:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

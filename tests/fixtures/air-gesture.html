<!doctype html>
<meta charset="utf-8"><title>Air gesture integration</title>
<style>body{margin:0}#root{height:100vh}</style>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { LearningWhiteboard } from '/src/learning/oll/oll-lesson-runtime.tsx';
import { HandwritingCapture } from '/src/learning/handwriting/handwriting-capture.ts';
import { makeHandwritingLandmarks } from '/src/learning/handwriting/simulated-trajectory.ts';
import { handPalmCenter } from '/src/learning/handwriting/handwriting-gesture.ts';
import '/src/index.css';
import '/src/learning/learning-workspace.css';
localStorage.setItem('octos-learn-experiment-air-writing','true');
window.asked=[];
HandwritingCapture.prototype.start=async function(){window.feedFrame=frame=>this.callbacks.onFrame(frame);this.callbacks.onState('tracking');};
createRoot(document.getElementById('root')).render(React.createElement(LearningWhiteboard,{
 inkSessionId:'air-integration',onAskInkSelection:request=>{window.asked.push(request.toolId);}
}));
let time=0;
window.loseHand=()=>{time+=33;window.feedFrame({timeMs:time,tracked:false,processingMs:1,pipelineMs:1});};
window.hand=async function(x,y,closed,count=4){
 const viewport=document.querySelector('.learning-oll-board');
 const rect=viewport.getBoundingClientRect();
 const palm={x:1-(.1+(x-rect.left)/rect.width*.8),y:.08+(y-rect.top)/rect.height*.84};
 const points=makeHandwritingLandmarks({x:.4,y:.3},closed?.1:.75,'pinch');
 const center=handPalmCenter(points);
 const landmarks=points.map(p=>({x:p.x+palm.x-center.x,y:p.y+palm.y-center.y}));
 for(let i=0;i<count;i++){
  time+=33;window.feedFrame({timeMs:time,tracked:true,landmarks,processingMs:1,pipelineMs:1});
  await new Promise(resolve=>requestAnimationFrame(resolve));
 }
};
</script>

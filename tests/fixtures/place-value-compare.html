<!doctype html>
<meta charset="utf-8"><title>Place-value compare card in the lesson board</title>
<style>html,body {margin:0;} #root {width:100vw;height:100vh;}</style>
<div id="root"></div>
<script>
// The place-value compare card serves US K-12 lessons: English unless the test asks otherwise. A classic script runs
// before the module below imports the app, which reads the language once when it loads.
try{localStorage.setItem('octos-locale',new URLSearchParams(location.search).get('lang')??'en-US');}catch{}
</script>
<script type="module">
// The place-value compare card (OLL decision 0029) in Learn's real lesson board, filling the window (desktop only),
// with the lesson already played: the practice pair on the card and its task beside it with no "done". The task is
// the lesson's only one and ends on the card (the learner's sign); nothing is typed under it. The lessons are OLL's
// own test fixtures at the pinned commit (packages/plugin-math/test/place-value-compare-fixtures.ts, compareLesson,
// with the pairs of scripts/check-place-value-compare-browser.mjs), compiled with normalizeAuthoringLesson.
import React from 'react';
import {createRoot} from 'react-dom/client';
import {useOllLessonRuntime} from '/src/learning/oll/use-oll-lesson-runtime.ts';
import {OllLessonBoard} from '/src/learning/oll/oll-lesson-runtime.tsx';
import {buildOllLessonTopics} from '/src/learning/oll/oll-artifacts.ts';
// ?lesson=whole (default): 4,530 and 4,503 shown, practice 6,281 and 6,218.
import whole from './place-value-compare-whole.canonical.jsonl?raw';
// ?lesson=zh: 0.45 and 0.405 shown, practice 0.625 and 0.7 (Chinese).
import zh from './place-value-compare-zh.canonical.jsonl?raw';
// ?lesson=equal: 0.7 and 0.70 shown, practice 2.50 and 2.5 (written decimals bound).
import equal from './place-value-compare-equal.canonical.jsonl?raw';
// ?lesson=widest: 2,345.678 and 2,345.687 shown, practice 3,456.789 and 3,456.798, seven columns.
import widest from './place-value-compare-widest.canonical.jsonl?raw';
import '/src/index.css';
import '/src/learning/learning-workspace.css';
import 'octos-lesson-language/web-runtime/styles.css';
const chosen=new URLSearchParams(location.search).get('lesson');
const source={zh,equal,widest}[chosen]??whole;
const topics=buildOllLessonTopics([source.trim().split('\n').map(line=>JSON.parse(line))]);
const key=new URLSearchParams(location.search).get('key')??'place-value-compare';
function App(){
 const runtime=useOllLessonRuntime({source,storageKey:key,startAtEnd:true,autoPlay:false,topics});
 window.compareRuntime=runtime;
 if(!runtime?.board)return null;
 return React.createElement(OllLessonBoard,{runtime,inkSessionId:key,portableCourseRegion:{x:20,y:20,reservedWidth:1300}});
}
createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

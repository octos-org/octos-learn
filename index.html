<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/octos-logo-color.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/octos-logo-light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/octos-logo-dark.svg"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="/images/octos-logo-color.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f7f3" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Octos Learn</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Keep this watchdog ES5-only: it must run even when an old, vendor-
      // frozen Android WebView cannot parse the application bundle.
      (function () {
        var locale;
        try { locale = localStorage.getItem("octos-locale"); } catch (e) {}
        if (locale !== "zh-CN" && locale !== "en-US") locale = /^zh/i.test(navigator.language || "en") ? "zh-CN" : "en-US";
        document.documentElement.lang = locale;
        var zh = locale === "zh-CN";
        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.getAttribute("data-octos-booted") === "true") return;
          root.innerHTML =
            '<div style="box-sizing:border-box;min-height:100vh;padding:48px;background:#171512;color:#f5eee4;font:20px/1.6 sans-serif">' +
            '<h1 style="margin:0 0 16px;font-size:30px">' + (zh ? 'Octos Learn 启动失败' : 'Octos Learn could not start') + '</h1>' +
            '<p>' + (zh ? '当前浏览器内核可能过旧，或应用资源未能加载。请使用大屏专用 APK，或更新 Android System WebView 后重试。' : 'Your browser may be too old, or the app resources could not load. Use the large-screen APK or update Android System WebView, then try again.') + '</p>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:12px 24px;font-size:18px">' + (zh ? '重新加载' : 'Reload') + '</button>' +
            '</div>';
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星狐 · 双眼表情验证</title>
<style>
body{margin:0;background:#f4f1ea;color:#243649;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0 18px}.layout{display:grid;grid-template-columns:minmax(280px,512px) minmax(230px,1fr);gap:28px}canvas{display:block;width:100%;border-radius:18px}label{display:block;margin:20px 0}label span{display:flex;justify-content:space-between}input{width:100%;accent-color:#956a2f}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{font:inherit;color:inherit;padding:8px 14px;border:1px solid #bec8cb;border-radius:24px;background:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{background:#243649;color:#fff}.note{color:#52616e;font-size:14px}#status{min-height:52px}video{display:none}@media(max-width:640px){.layout{grid-template-columns:1fr;gap:8px}main{margin:16px auto}.layout canvas{max-width:460px;margin:auto}}
</style>
<main><h1>星狐 · 双眼表情验证</h1><p>保持原画的眼球形状，让眼皮逐渐遮住眼睛。可分别眨眼，也可双眼同时闭合。</p>
<div class="layout"><canvas id="face" width="512" height="512" aria-label="星狐双眼表情"></canvas><section aria-label="表情控制">
<label><span>画面左眼闭合 <output id="left-value">0%</output></span><input id="left" aria-label="画面左眼闭合" type="range" min="0" max="1" step=".001" value="0" disabled></label>
<label><span>画面右眼闭合 <output id="right-value">0%</output></span><input id="right" aria-label="画面右眼闭合" type="range" min="0" max="1" step=".001" value="0" disabled></label>
<div class="buttons"><button id="neutral" disabled>自然睁眼</button><button id="closed" disabled>双眼闭合</button><button id="demo" disabled aria-pressed="false">眨眼演示</button></div>
<p id="status" role="status">正在读取本地素材…</p>
<div class="buttons"><button id="camera" disabled>开启摄像头跟随</button><button id="stop" disabled>停止摄像头</button><button id="check" disabled>检查本机识别能力</button></div>
<p class="note">嘴型、视线和转头尚未加入本样本。摄像头只在点击后开启，用于本机识别；不录音，不保存或上传画面。“检查本机识别能力”使用空白画面，不开启摄像头。</p>
</section></div><video id="video" muted playsinline></video></main>
<script type="module">
import {prepareEyeOcclusion,drawEyeOcclusion} from './eye-occlusion.mjs';
const makeCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const canvas=document.querySelector('#face'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const sliders={left:document.querySelector('#left'),right:document.querySelector('#right')};
const buttons=Object.fromEntries(['neutral','closed','demo','camera','stop','check'].map(k=>[k,document.getElementById(k)]));
const livePage=location.protocol==='https:';let images,rig,capture,smoother,mode='manual',raf=0,start=0,checkController,disposed=false,ready=false;
function message(text){status.textContent=text;}
function availability(){for(const s of Object.values(sliders))s.disabled=!ready||mode==='live';buttons.neutral.disabled=buttons.closed.disabled=buttons.demo.disabled=!ready||mode==='live';buttons.camera.disabled=!ready||!livePage||mode==='live'||!!checkController;buttons.stop.disabled=mode!=='live';buttons.check.disabled=!ready||!livePage||mode==='live';buttons.check.textContent=checkController?'取消检查':'检查本机识别能力';}
function draw(){if(!ready||disposed)return;const state=Object.fromEntries(Object.entries(sliders).map(([k,s])=>[k,Number(s.value)]));for(const k of ['left','right'])document.getElementById(k+'-value').value=Math.round(state[k]*100)+'%';drawEyeOcclusion(ctx,images,rig,state);}
function stopDemo(){cancelAnimationFrame(raf);if(mode==='demo')mode='manual';buttons.demo.textContent='眨眼演示';buttons.demo.setAttribute('aria-pressed','false');}
function pose(left,right){stopDemo();sliders.left.value=left;sliders.right.value=right;draw();}
function tick(now){if(mode!=='demo'||disposed)return;const t=((now-start)/1000)%6,smooth=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p);};let l=0,r=0;if(t>=1&&t<3){const v=t<2?smooth(t-1):1-smooth(t-2);l=r=v;}else if(t>=4&&t<5){l=Math.sin((t-4)*Math.PI)**2;}sliders.left.value=l;sliders.right.value=r;draw();raf=requestAnimationFrame(tick);}
function stopCapture(){if(mode==='live')mode='manual';capture?.stop();smoother?.reset();pose(0,0);availability();}
try{
 images=Object.fromEntries(await Promise.all(['source','face'].map(async key=>{const image=new Image();image.src='materials/'+key+'.png';await image.decode();return[key,image];})));
 if(!disposed){rig=prepareEyeOcclusion(makeCanvas,images.source,images.face);ready=true;draw();availability();message(livePage?'素材就绪 · 当前为手动调节，摄像头已关闭。':'素材就绪 · 可手动调节；摄像头功能需从本机 HTTPS 开发页面打开。');}
}catch{message('素材读取失败，请重新打开页面。');}
for(const slider of Object.values(sliders))slider.oninput=()=>{stopDemo();draw();message('正在手动调节 · 摄像头已关闭。');};
buttons.neutral.onclick=()=>{pose(0,0);message('已恢复原画睁眼状态。');};buttons.closed.onclick=()=>{pose(1,1);message('双眼完全闭合 · 摄像头已关闭。');};
buttons.demo.onclick=()=>{if(mode==='demo'){stopDemo();message('演示已暂停。');return;}mode='demo';start=performance.now();buttons.demo.textContent='暂停演示';buttons.demo.setAttribute('aria-pressed','true');message('固定参数演示 · 没有使用摄像头。');raf=requestAnimationFrame(tick);};
buttons.camera.onclick=async()=>{
 stopDemo();mode='live';availability();message('正在准备摄像头…');
 try{const [{FaceCapture},{FaceSmoother}]=await Promise.all([import('/src/learning/avatar/face-capture.ts'),import('/src/learning/avatar/face-frame.ts')]);if(disposed||mode!=='live')return;
  smoother=new FaceSmoother();capture=new FaceCapture(document.querySelector('#video'),{
   onState(state){if(disposed||mode!=='live')return;const texts={idle:'摄像头已关闭。',starting:'请在浏览器中允许摄像头访问。',loading:'正在准备本机面部识别…',tracking:'正在跟随眨眼 · 画面仅在本机处理。',lost:'暂未找到人脸，表情正在回到自然状态。'};message(texts[state]);},
   onError(){if(disposed)return;mode='manual';pose(0,0);availability();message('摄像头或本机识别未能启动，可继续使用手动调节。');},
   onFrame(frame){if(disposed||mode!=='live')return;const filtered=smoother.update(frame,performance.now());sliders.left.value=filtered.channels.eyeBlinkLeft??0;sliders.right.value=filtered.channels.eyeBlinkRight??0;draw();},
  });await capture.start();
 }catch{if(!disposed){stopCapture();message('摄像头跟随暂不可用，可继续使用手动调节。');}}
};
buttons.stop.onclick=()=>{stopCapture();message('摄像头已关闭，已恢复自然睁眼。');};
buttons.check.onclick=async()=>{
 if(checkController){checkController.abort();return;}stopDemo();const controller=new AbortController();checkController=controller;availability();message('正在用空白画面检查本机识别，不会打开摄像头…');
 try{const {selfTestFaceModel}=await import('/src/learning/avatar/face-capture.ts');if(disposed)return;await selfTestFaceModel(controller.signal);if(!disposed)message('本机识别检查通过 · 没有打开摄像头。');}
 catch{if(!disposed)message(controller.signal.aborted?'检查已取消。':'本机识别检查未通过；手动表情仍可使用。');}
 finally{if(checkController===controller)checkController=undefined;if(!disposed)availability();}
};
function cleanup(){disposed=true;stopDemo();checkController?.abort();capture?.stop();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopDemo();checkController?.abort();if(mode==='live'){stopCapture();message('页面已离开，摄像头已关闭。');}}});window.addEventListener('pagehide',cleanup);
</script></html>

<style>body{margin:0;background:#f4f1ea;color:#243649;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:28px auto;padding:0 20px}.layout{display:grid;grid-template-columns:minmax(280px,512px) 1fr;gap:24px}canvas{width:100%;border-radius:16px}h1{font-size:26px;margin:0 0 12px}p{margin:10px 0}button{font:inherit;padding:8px 14px;border:1px solid #bec8cb;border-radius:20px;background:white;color:inherit;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#eae8e0;padding:14px;border-radius:12px}progress{width:100%}video{display:none}.note{font-size:14px;color:#52616e}@media(max-width:650px){.layout{grid-template-columns:1fr}}</style>
<main><h1>本地视频 → 网页识别 → 星狐</h1><p>使用项目已有的公开视频样本，运行与互动页相同的识别 Worker。不会打开摄像头、麦克风或上传画面。</p>
<div class="layout"><canvas id="avatar" width="536" height="536" aria-label="识别参数驱动的星狐"></canvas><section><div class="actions"><button id="start" disabled>开始本地视频验证</button><button id="cancel" disabled>取消</button><button id="replay" disabled>回放识别结果</button><button id="report" disabled>下载验证报告</button><button id="track" disabled>下载动作片段</button></div><p id="status" role="status">准备角色素材…</p><progress id="progress" max="220" value="0" aria-label="识别进度"></progress><pre id="summary">尚未运行</pre><p class="note">这是开发验证页，使用本机 scratch 目录已有的 LivePortrait d10.mp4；不包含素材分发。视频正常输入 8 秒、空白输入 2 秒、恢复最后一帧 1 秒。运行完成前，不应将此页面当成已通过的证据。</p></section></div><video id="video" muted playsinline preload="none"></video></main>

  <script>
  (()=>{
    const root=document.getElementById('octos-layout-proposals');
    const courses=JSON.parse(root.querySelector('[data-data]').textContent);
    const picker=root.querySelector('[data-course]'),board=root.querySelector('[data-board]');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const design={spacing:20,practice:'全部练习展开'};
    let current=0,queued=false;
    picker.innerHTML=courses.map((c,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} / ${courses.length}　${esc(c.title)}</option>`).join('');
    function card(n){const visual=['geometry','plot','scene3d','image','diagram'].includes(n.kind);const width=visual?n.width:n.kind==='math'?Math.min(760,Math.max(110,n.width+12)):Math.max(260,Math.min(440,n.width));
      if(visual)return `<div class="om-card om-picture" data-node="${esc(n.id)}" data-natural="${width}" style="width:${width}px"><span class="om-kind">${n.kind==='scene3d'?'空间图形':n.kind==='plot'?'函数图像':'几何图形'} · 静态示意</span><h3>${esc(n.title)}</h3>${n.body}${n.caption?`<div class="om-caption">${esc(n.caption)}</div>`:''}</div>`;
      if(n.kind==='math')return `<div class="om-card om-math" data-node="${esc(n.id)}" data-natural="${width}" style="width:${width}px"><div class="om-math-inner">${n.body}</div></div>`;
      return `<div class="om-card om-note" data-node="${esc(n.id)}" data-natural="${width}" style="width:${width}px">${n.title?`<h3>${esc(n.title)}</h3>`:''}${n.items.length?`<ul>${n.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}${n.text?`<p>${esc(n.text)}</p>`:''}</div>`;
    }
    function rail(c,aliases){let controls=c.controls.filter(v=>aliases.includes(v.as));if(!controls.length)return '';let tasks=c.tasks.filter(t=>t.variables.some(v=>aliases.includes(v)));if(design.practice==='仅首题预览')tasks=tasks.slice(0,1);
      return `<div class="om-rail"><div class="om-card om-controls"><h3>操作这里 · 关联图形</h3>${controls.map(v=>{let pct=Math.max(0,Math.min(100,(v.value-v.min)/(v.max-v.min)*100));return `<div class="om-control"><div class="om-control-label"><span>${esc(v.label)}</span><span class="om-control-value">${esc(v.value)}</span></div><div class="om-slider" style="--slider-percent:${pct}%" role="img" aria-label="${esc(v.label)}滑块示意"><span></span><i></i></div></div>`}).join('')}</div>${tasks.length?`<div class="om-card om-tasks"><h3>动手试一试 · 操作相邻控件</h3>${tasks.map((t,i)=>`<div class="om-task"><small>练习 ${i+1} / ${tasks.length}</small><p>${esc(t.prompt)}</p></div>`).join('')}</div>`:''}</div>`;
    }
    function render(){const c=courses[current];picker.value=current;root.querySelector('[data-title]').textContent=c.title;const count=c.steps.reduce((a,s)=>a+s.nodes.length,0);root.querySelector('[data-meta]').textContent=`${c.steps.filter(s=>s.nodes.length).length} 个建卡步骤 · ${count} 张内容卡 · ${c.controls.length} 个控件 · ${c.tasks.length} 道练习 · ${design.practice}`;
      board.innerHTML=c.steps.filter(s=>s.nodes.length).map(s=>{let vis=s.nodes.filter(n=>['geometry','plot','scene3d','image','diagram'].includes(n.kind)),reading=s.nodes.filter(n=>!vis.includes(n));let temp=document.createElement('div');temp.innerHTML=rail(c,s.controlAliases);let controls=temp.querySelector('.om-controls')?.outerHTML||'',tasks=temp.querySelector('.om-tasks')?.outerHTML||'';return `<section class="om-step" data-step="${s.index}"><div class="om-step-heading"><span class="om-step-number">${String(s.index).padStart(2,'0')}</span><h2>${esc(s.purpose||'课程步骤 '+s.index)}</h2></div><div class="om-stage">${vis.length?`<div class="om-left"><div class="om-pictures">${vis.map(card).join('')}</div>${controls}</div>`:''}<div class="om-right">${reading.length?`<div class="om-flow">${reading.map(card).join('')}</div>`:''}${tasks}</div></div></section>`}).join('');layout();
    }
    function fitMath(){root.querySelectorAll('.om-math').forEach(card=>{const wrap=card.querySelector('.om-math-inner');for(const m of wrap.querySelectorAll('math')){m.style.fontSize='22px';m.style.width='max-content';m.style.maxWidth='none';m.style.margin='4px 0';const max=wrap.clientWidth;const box=m.getBoundingClientRect();const actual=Math.max(m.scrollWidth,box.width,...[...m.querySelectorAll('semantics,mrow,mtable')].map(e=>e.getBoundingClientRect().right-box.left));if(actual>max){m.style.fontSize=(22*(max-2)/actual)+'px';}} });}
    function layout(){const G=design.spacing;
      root.querySelectorAll('.om-stage').forEach(stage=>{const W=stage.clientWidth,left=stage.querySelector('.om-left'),right=stage.querySelector('.om-right'),flow=stage.querySelector('.om-flow'),tasks=stage.querySelector('.om-tasks'),controls=stage.querySelector('.om-controls');const fNodes=flow?[...flow.children]:[];
        const flowMin=fNodes.length?Math.min(W,Math.max(280,...fNodes.map(e=>Math.min(Number(e.dataset.natural),680)))):0;
        if(!left){right.style.width=W+'px';if(flow){flow.style.width=Math.min(W,fNodes.reduce((n,e)=>n+Number(e.dataset.natural)+14,0))+'px';fNodes.forEach(e=>e.style.width=Math.min(Number(e.dataset.natural),flow.clientWidth)+'px');}return;}
        const pics=left.querySelector('.om-pictures'),pNodes=[...pics.children];const pSum=pNodes.reduce((n,e)=>n+Number(e.dataset.natural),0)+(pNodes.length-1)*16;
        const leftWidth=Math.min(W,Math.max(pSum,controls?330:0)),rightMin=Math.max(flowMin,tasks?330:0);const side=leftWidth+G+rightMin<=W;
        stage.style.flexDirection=side?'row':'column';stage.style.gap=G+'px';left.style.width=leftWidth+'px';right.style.width=(side?Math.min(Math.max(680,rightMin),W-leftWidth-G):W)+'px';pics.style.width=Math.min(pSum,leftWidth)+'px';pics.style.flexWrap='wrap';pNodes.forEach(e=>e.style.width=Math.min(Number(e.dataset.natural),pics.clientWidth)+'px');
        if(controls){controls.style.width=Math.min(360,leftWidth)+'px';controls.style.marginTop='16px';controls.style.alignSelf=side&&tasks?'flex-end':'flex-start';}
        if(flow){flow.style.width=right.clientWidth+'px';fNodes.forEach(e=>e.style.width=Math.min(Number(e.dataset.natural),flow.clientWidth)+'px');}
        if(tasks){tasks.style.width=Math.min(360,side?right.clientWidth:W)+'px';tasks.style.marginTop='16px';if(side){right.appendChild(tasks);}else{left.appendChild(tasks);tasks.style.width=Math.min(360,leftWidth)+'px';}}
        fitMath();
        if(side&&tasks&&controls){const top=right.getBoundingClientRect().top,ct=controls.getBoundingClientRect().top-top;const fh=flow?flow.getBoundingClientRect().height:0,th=tasks.getBoundingClientRect().height;tasks.style.marginTop=Math.max(16,ct+10-fh-th)+'px';}
        stage.dataset.template=side?'visual-reading-adjacent':'interaction-then-reading';
      });fitMath();root.dataset.ready='true';
    }
    function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{course:courses[current].id,practice:design.practice},privateContent:{index:current}}).catch(()=>{});}
    function select(i){current=(i+courses.length)%courses.length;render();persist();}
    picker.onchange=()=>select(Number(picker.value));root.querySelector('[data-prev]').onclick=()=>select(current-1);root.querySelector('[data-next]').onclick=()=>select(current+1);
    function restore(s){let i=courses.findIndex(c=>c.id===s?.modelContent?.course);if(i<0&&Number.isInteger(s?.privateContent?.index))i=s.privateContent.index;if(i>=0&&i<courses.length)current=i;if(['全部练习展开','仅首题预览'].includes(s?.modelContent?.practice))design.practice=s.modelContent.practice;render();}
    restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
    new ResizeObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;layout();});}).observe(root);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'spacing',{label:'关联区间距',min:12,max:32,step:2,unit:'px'});tweak.addSelect(design,'practice',{label:'练习展示',options:['全部练习展开','仅首题预览']});}
    root.mockup={courses,select,layout,design};
  })();
  </script>
</div>
</html>

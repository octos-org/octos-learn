<!doctype html><meta charset="utf-8"><title>全课程方案对比</title><style>body{font:16px/1.6 system-ui;margin:24px;background:#f7f5ee;color:#263b35}select{font:inherit;max-width:100%;margin:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;border:1px solid #ddd}h2{font-size:18px} @media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>15门课程 · 新旧方案对比</h1><p>均为完整长图示意，非应用实测。新方案：公式连续、笔记按出场区间旁置、操作区顶对齐。</p><label>课程<select id="course"></select></label><label>图片宽度<select id="width"><option>1920</option><option selected>1440</option><option>700</option></select></label><main><section><h2>上一版：混合解释流</h2><a id="oldlink"><img id="old" alt="上一版效果图"></a></section><section><h2>第二版：连续公式路径</h2><a id="newlink"><img id="new" alt="第二版效果图"></a></section></main><script>const courses=[{"id": "fraction-comparing-unit-shares", "title": "直观理解分数的大小比较", "nodes": 7, "tasks": 2}, {"id": "fraction-equivalent-visuals", "title": "等价分数的图形直观与原理", "nodes": 9, "tasks": 3}, {"id": "fraction-notation-and-parts", "title": "直观理解分数的意义与结构", "nodes": 6, "tasks": 2}, {"id": "fraction-what-is-a-half", "title": "认识分数的初步概念：从方格到二分之一", "nodes": 7, "tasks": 2}, {"id": "linear-intro-and-slope", "title": "正比例函数 y = kx 与斜率的几何意义", "nodes": 3, "tasks": 2}, {"id": "linear-plotting-points", "title": "一次函数 y = 2x - 1 的图像本质与画法", "nodes": 5, "tasks": 3}, {"id": "linear-simultaneous-intersections", "title": "二元一次方程组与一次函数的几何意义", "nodes": 9, "tasks": 0}, {"id": "rectangle-area-from-tiles", "title": "长方形的面积与周长", "nodes": 5, "tasks": 1}, {"id": "slope-and-intercept", "title": "一次函数 y = mx + b 的图像与性质", "nodes": 5, "tasks": 3}, {"id": "surface-paraboloid-level-sets", "title": "水平截线与等高线：以 z=x²+y² 为例", "nodes": 5, "tasks": 1}, {"id": "surface-partial-derivative-slice", "title": "偏导数：固定输入，求截线斜率", "nodes": 9, "tasks": 1}, {"id": "surface-saddle-point-analysis", "title": "马鞍面与鞍点：梯度为零不一定是极值点", "nodes": 14, "tasks": 0}, {"id": "trig-cosine-and-phase-shift", "title": "余弦函数与单位圆投影", "nodes": 9, "tasks": 1}, {"id": "trig-quadrants-and-monotonicity", "title": "单位圆与正弦函数的单调性及象限循环", "nodes": 8, "tasks": 3}, {"id": "trig-unit-circle-to-sine", "title": "从单位圆旋转到正弦曲线", "nodes": 7, "tasks": 1}];const picker=document.getElementById('course'),w=document.getElementById('width');picker.innerHTML=courses.map(c=>`<option value="${c.id}">${c.title}</option>`).join('');picker.value='fraction-equivalent-visuals';function render(){const f=picker.value+'-'+w.value+'.png';for(const [id,src] of [['old','../proposal-mockups/images/'+f],['new','images/'+f]]){document.getElementById(id).src=src;document.getElementById(id+'link').href=src;}}picker.onchange=w.onchange=render;render();</script>

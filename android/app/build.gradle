plugins {
    id "com.android.application"
}

def androidLocalProperties = new Properties()
def androidLocalPropertiesFile = rootProject.file("local.properties")
if (androidLocalPropertiesFile.exists()) {
    androidLocalPropertiesFile.withInputStream {
        androidLocalProperties.load(it)
    }
}

def androidTtsSetting = { String propertyName, String environmentName, String fallback ->
    def propertyValue = androidLocalProperties.getProperty(propertyName)?.trim()
    if (propertyValue) return propertyValue
    def environmentValue = System.getenv(environmentName)?.trim()
    return environmentValue ?: fallback
}

def buildConfigString = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace "cc.pitun.learn"
    compileSdk 35

    defaultConfig {
        applicationId "cc.pitun.learn"
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName "0.1.0-test18"
        buildConfigField "String", "VOLC_TTS_APP_ID", buildConfigString(
                androidTtsSetting("octos.tts.appId", "OCTOS_ANDROID_TTS_APP_ID", ""))
        buildConfigField "String", "VOLC_TTS_ACCESS_TOKEN", buildConfigString(
                androidTtsSetting("octos.tts.accessToken", "OCTOS_ANDROID_TTS_ACCESS_TOKEN", ""))
        buildConfigField "String", "VOLC_TTS_CLUSTER", buildConfigString(
                androidTtsSetting("octos.tts.cluster", "OCTOS_ANDROID_TTS_CLUSTER", "volcano_tts"))
        buildConfigField "String", "VOLC_TTS_VOICE_TYPE", buildConfigString(
                androidTtsSetting("octos.tts.voiceType", "OCTOS_ANDROID_TTS_VOICE_TYPE", "zh_female_xiaohe_uranus_bigtts"))
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ["wasm", "onnx"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "io.agora.rtc:full-rtc-basic:4.5.2"
}

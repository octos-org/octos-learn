plugins {
    id "com.android.application"
}

android {
    namespace "cc.pitun.learn"
    compileSdk 35

    defaultConfig {
        applicationId "cc.pitun.learn"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName "0.1.0-test20"
        // The meeting display is ARM. Keep both 32-bit and 64-bit ARM because
        // vendor Android 8 firmware can run a 32-bit userspace on 64-bit CPUs,
        // but do not ship the two emulator-only x86 Agora runtimes.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ["wasm", "onnx"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "io.agora.rtc:full-rtc-basic:4.5.2"
}
